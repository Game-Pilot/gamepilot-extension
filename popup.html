<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GamePilot</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
      body { width: 300px; margin: 0; padding: 16px; background: #121824; color: #f5f7fb; }
      .heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      h1 { margin: 0 0 4px; font-size: 17px; }
      #environment { padding: 4px 7px; border: 1px solid #475569; border-radius: 999px; color: #cbd5e1; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
      #environment.local { border-color: #f59e0b; background: #f59e0b20; color: #fbbf24; }
      #version-card { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; align-items: center; padding: 10px; border: 1px solid #2d3b52; border-radius: 10px; background: #0f1723; }
      #version-card > div span { color: #8491a8; font-size: 11px; }
      #installed-version { color: #e5e7eb; font-size: 14px; }
      #latest-version { grid-column: 1 / -1; color: #8491a8; font-size: 10px; }
      #version-badge { padding: 4px 7px; border: 1px solid #475569; border-radius: 999px; color: #cbd5e1; font-size: 9px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
      #version-badge.current { border-color: #166534; background: #14532d55; color: #86efac; }
      #version-badge.outdated { border-color: #b45309; background: #78350f55; color: #fbbf24; }
      #version-badge.preview { border-color: #0369a1; background: #0c4a6e55; color: #7dd3fc; }
      p { margin: 0; color: #a7b0c2; font-size: 12px; line-height: 1.45; }
      .stack { display: grid; gap: 10px; margin-top: 14px; }
      label { display: grid; gap: 6px; color: #cbd5e1; font-size: 12px; font-weight: 700; }
      input, button { width: 100%; box-sizing: border-box; border-radius: 8px; font: inherit; }
      input { border: 1px solid #38465e; padding: 9px 10px; background: #0f1723; color: #f5f7fb; text-transform: uppercase; letter-spacing: .14em; }
      button { border: 0; padding: 10px; background: #38bdf8; color: #06121b; cursor: pointer; font-weight: 800; }
      button.secondary { border: 1px solid #38465e; background: #26344c; color: #dbeafe; }
      #status { display: flex; align-items: center; gap: 7px; color: #a7b0c2; }
      #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 10px #ef4444; }
      #status.connected::before { background: #34d399; box-shadow: 0 0 10px #34d399; }
      #result { min-height: 18px; color: #7dd3fc; }
      #result.error { color: #fca5a5; }
      #connection-details { display: none; gap: 7px; padding: 10px; border: 1px solid #2d3b52; border-radius: 10px; background: #0f1723; }
      #connection-details.visible { display: grid; }
      .detail { display: grid; grid-template-columns: 72px 1fr; gap: 8px; align-items: baseline; font-size: 11px; }
      .detail span { color: #8491a8; }
      .detail strong { overflow: hidden; color: #e5e7eb; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div class="heading"><h1>GamePilot</h1><span id="environment">Verificando…</span></div>
    <p>Vincule esta instalação à sua conta para separar cada navegador e aba.</p>
    <div class="stack">
      <div id="status">Verificando vínculo…</div>
      <div id="version-card">
        <div><span>Versão instalada</span><br><strong id="installed-version">—</strong></div>
        <span id="version-badge">Verificando…</span>
        <small id="latest-version">Consultando a versão publicada…</small>
      </div>
      <div id="connection-details">
        <div class="detail"><span>Conta</span><strong id="account-name">—</strong></div>
        <div class="detail"><span>E-mail</span><strong id="account-email">—</strong></div>
        <div class="detail"><span>Dispositivo</span><strong id="device-name">—</strong></div>
        <div class="detail"><span>Abas ativas</span><strong id="active-tabs">0</strong></div>
      </div>
      <form id="pair-form">
        <label>Código gerado no painel<input id="pair-code" maxlength="8" minlength="8" autocomplete="one-time-code" placeholder="AB12CD34" required></label>
        <button type="submit">Vincular extensão</button>
      </form>
      <button id="refresh-status" type="button" class="secondary">Atualizar status</button>
      <p id="result" aria-live="polite"></p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
